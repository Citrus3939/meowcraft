<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Standalone Cosplay Hero Animation</title>
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-width: 320px;
        min-height: 100%;
        margin: 0;
        background: #050711;
        color: #f7fbff;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      .hero {
        position: relative;
        min-height: 100svh;
        overflow: hidden;
        isolation: isolate;
      }

      canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }

      .copy {
        position: relative;
        z-index: 2;
        display: grid;
        align-content: end;
        width: min(1120px, calc(100% - 40px));
        min-height: 100svh;
        margin-inline: auto;
        padding-block: clamp(88px, 12vw, 150px);
        pointer-events: none;
      }

      .copy::before {
        position: absolute;
        inset: auto -12vw 0;
        z-index: -1;
        height: 54%;
        content: "";
        background: linear-gradient(180deg, rgba(5, 7, 17, 0), rgba(5, 7, 17, 0.78));
      }

      .kicker {
        margin: 0 0 18px;
        color: #8cf6ff;
        font-size: clamp(0.74rem, 1.4vw, 0.9rem);
        font-weight: 900;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      h1 {
        max-width: 860px;
        margin: 0;
        font-size: clamp(3.4rem, 10vw, 9rem);
        font-weight: 900;
        letter-spacing: -0.08em;
        line-height: 0.88;
        text-transform: uppercase;
      }

      .copy > p:not(.kicker) {
        max-width: 640px;
        margin: 24px 0 0;
        color: rgba(247, 251, 255, 0.74);
        font-size: clamp(1rem, 1.8vw, 1.25rem);
        line-height: 1.65;
      }

      .status {
        width: fit-content;
        margin-top: 28px;
        padding: 8px 12px;
        border: 1px solid rgba(140, 246, 255, 0.34);
        color: #8cf6ff;
        font-size: 0.78rem;
        font-weight: 800;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        background: rgba(5, 7, 17, 0.48);
      }

      .uploads {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 18px;
        pointer-events: auto;
      }

      label {
        display: grid;
        gap: 7px;
        min-width: min(230px, 100%);
        color: rgba(247, 251, 255, 0.72);
        font-size: 0.78rem;
        font-weight: 800;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      input {
        width: 100%;
        border: 1px solid rgba(140, 246, 255, 0.26);
        border-radius: 999px;
        color: rgba(247, 251, 255, 0.84);
        background: rgba(5, 7, 17, 0.56);
      }

      input::file-selector-button {
        margin-right: 12px;
        padding: 10px 14px;
        border: 0;
        color: #061018;
        font-weight: 900;
        background: #8cf6ff;
      }

      @media (max-width: 720px) {
        .copy {
          width: calc(100% - 28px);
          padding-block: 84px 36px;
        }

        h1 {
          font-size: clamp(3rem, 17vw, 5.2rem);
        }

        .uploads {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <section class="hero">
      <canvas id="heroCanvas"></canvas>
      <div class="copy">
        <p class="kicker">Direct standalone preview</p>
        <h1>Words become wigs.</h1>
        <p>Open this file directly, or upload your avatar silhouette and finished wig image to test the full flow.</p>
        <div class="status" id="status">Lexicon drift</div>
        <div class="uploads">
          <label>
            Avatar PNG
            <input id="avatarInput" type="file" accept="image/png,image/webp,image/jpeg" />
          </label>
          <label>
            Wig PNG
            <input id="wigInput" type="file" accept="image/png,image/webp,image/jpeg" />
          </label>
        </div>
      </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
    <script>
      const WORDS = [
        "Miku",
        "Cosplay",
        "Wig",
        "Custom",
        "Handmade",
        "Anime",
        "Styling",
        "Twin Tails",
        "Vocaloid",
        "Commission",
        "Craft",
        "Fiber",
        "Character",
        "Kawaii",
        "Stage",
        "Identity",
        "Silhouette",
        "Studio",
      ];

      const canvas = document.querySelector("#heroCanvas");
      const statusEl = document.querySelector("#status");
      const avatarInput = document.querySelector("#avatarInput");
      const wigInput = document.querySelector("#wigInput");
      const ctx = canvas.getContext("2d", { alpha: false });
      const state = { stage: "floating", breath: 1, mask: 0 };
      const pointer = { x: 0, y: 0 };
      let particles = [];
      let avatarImage = null;
      let wigImage = null;
      let raf = 0;
      let last = performance.now();
      let timeline = null;

      const rand = (min, max) => min + Math.random() * (max - min);
      const clamp = (value, min, max) => Math.max(min, Math.min(max, value));

      function setStatus(text) {
        statusEl.textContent = text;
      }

      function loadImageFromUrl(url) {
        return new Promise((resolve) => {
          const image = new Image();
          image.onload = () => resolve(image);
          image.onerror = () => resolve(null);
          image.src = url;
        });
      }

      function resize() {
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = Math.floor(window.innerWidth * dpr);
        canvas.height = Math.floor(window.innerHeight * dpr);
        canvas.style.width = `${window.innerWidth}px`;
        canvas.style.height = `${window.innerHeight}px`;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        createParticles();
      }

      function createParticles() {
        const count = window.innerWidth < 720 ? 210 : 360;
        particles = Array.from({ length: count }, (_, index) => {
          const x = rand(-window.innerWidth * 0.1, window.innerWidth * 1.1);
          const y = rand(-window.innerHeight * 0.1, window.innerHeight * 1.1);
          const alpha = rand(0.22, 0.84);
          return {
            word: WORDS[index % WORDS.length],
            x,
            y,
            startX: x,
            startY: y,
            vx: rand(-0.12, 0.12),
            vy: rand(-0.1, 0.1),
            size: rand(12, 32),
            alpha,
            baseAlpha: alpha,
            rotation: rand(-0.08, 0.08),
            stretch: 1,
            spacing: 0,
          };
        });
      }

      function fallbackPoints(count) {
        const points = [];
        const cx = window.innerWidth * 0.5;
        const cy = window.innerHeight * 0.48;
        const scale = Math.min(window.innerWidth, window.innerHeight) * 0.26;
        for (let i = 0; i < count * 8; i++) {
          const t = Math.random() * Math.PI * 2;
          const r = Math.sqrt(Math.random());
          let x = cx + Math.cos(t) * scale * 0.72 * r;
          let y = cy + Math.sin(t) * scale * 0.78 * r;
          const twin = Math.random();
          if (twin < 0.35) {
            x = cx - scale * 1.1 + Math.cos(t) * scale * 0.55 * r;
            y = cy + scale * 0.16 + Math.sin(t) * scale * 1.1 * r;
          } else if (twin < 0.7) {
            x = cx + scale * 1.1 + Math.cos(t) * scale * 0.55 * r;
            y = cy + scale * 0.16 + Math.sin(t) * scale * 1.1 * r;
          }
          points.push({ x, y });
        }
        return points.slice(0, count);
      }

      function sampleImagePoints(image, count) {
        if (!image) return fallbackPoints(count);
        const off = document.createElement("canvas");
        const maxSide = 420;
        const ratio = image.naturalWidth / image.naturalHeight;
        off.width = ratio >= 1 ? maxSide : Math.round(maxSide * ratio);
        off.height = ratio >= 1 ? Math.round(maxSide / ratio) : maxSide;
        const offCtx = off.getContext("2d", { willReadFrequently: true });
        offCtx.drawImage(image, 0, 0, off.width, off.height);
        const data = offCtx.getImageData(0, 0, off.width, off.height).data;
        const candidates = [];
        const step = Math.max(2, Math.floor(Math.sqrt((off.width * off.height) / (count * 16))));
        for (let y = 0; y < off.height; y += step) {
          for (let x = 0; x < off.width; x += step) {
            if (data[(y * off.width + x) * 4 + 3] > 32) candidates.push({ x, y });
          }
        }
        if (candidates.length < count * 0.3) return fallbackPoints(count);
        const bounds = candidates.reduce(
          (acc, p) => ({
            minX: Math.min(acc.minX, p.x),
            minY: Math.min(acc.minY, p.y),
            maxX: Math.max(acc.maxX, p.x),
            maxY: Math.max(acc.maxY, p.y),
          }),
          { minX: Infinity, minY: Infinity, maxX: -Infinity, maxY: -Infinity },
        );
        const sourceW = bounds.maxX - bounds.minX || 1;
        const sourceH = bounds.maxY - bounds.minY || 1;
        const targetW = Math.min(window.innerWidth * 0.72, window.innerHeight * 0.72 * (sourceW / sourceH));
        const targetH = targetW / (sourceW / sourceH);
        const offsetX = window.innerWidth * 0.5 - targetW * 0.5;
        const offsetY = window.innerHeight * 0.48 - targetH * 0.5;
        const stride = Math.max(1, Math.floor(candidates.length / count));
        return Array.from({ length: count }, (_, i) => {
          const p = candidates[(i * stride) % candidates.length];
          return {
            x: offsetX + ((p.x - bounds.minX) / sourceW) * targetW,
            y: offsetY + ((p.y - bounds.minY) / sourceH) * targetH,
          };
        });
      }

      function drawSpacedText(text, x, y, spacing) {
        if (spacing <= 0.2) {
          ctx.fillText(text, x, y);
          return;
        }
        let cursor = x;
        for (const char of text) {
          ctx.fillText(char, cursor, y);
          cursor += ctx.measureText(char).width + spacing;
        }
      }

      function draw(delta) {
        ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
        ctx.fillStyle = "#050711";
        ctx.fillRect(0, 0, window.innerWidth, window.innerHeight);
        const glow = ctx.createRadialGradient(
          window.innerWidth * 0.5,
          window.innerHeight * 0.45,
          0,
          window.innerWidth * 0.5,
          window.innerHeight * 0.45,
          window.innerWidth * 0.8,
        );
        glow.addColorStop(0, "rgba(72,228,255,.2)");
        glow.addColorStop(0.45, "rgba(147,102,255,.1)");
        glow.addColorStop(1, "rgba(5,7,17,0)");
        ctx.fillStyle = glow;
        ctx.fillRect(0, 0, window.innerWidth, window.innerHeight);

        ctx.save();
        ctx.translate(window.innerWidth / 2, window.innerHeight / 2);
        ctx.scale(state.breath, state.breath);
        ctx.translate(-window.innerWidth / 2, -window.innerHeight / 2);
        for (const p of particles) {
          if (state.stage === "floating") {
            p.x += p.vx * delta * 0.06;
            p.y += p.vy * delta * 0.06;
            if (p.x < -120) p.x = window.innerWidth + 120;
            if (p.x > window.innerWidth + 120) p.x = -120;
            if (p.y < -80) p.y = window.innerHeight + 80;
            if (p.y > window.innerHeight + 80) p.y = -80;
          }
          if (state.stage === "breathing") {
            p.x += Math.sin(performance.now() * 0.0007 + p.startX) * 0.012 * delta;
            p.y += Math.cos(performance.now() * 0.0006 + p.startY) * 0.012 * delta;
          }
          ctx.save();
          ctx.globalAlpha = clamp(p.alpha, 0, 1);
          ctx.translate(p.x + pointer.x * (p.size / 34), p.y + pointer.y * (p.size / 34));
          ctx.rotate(p.rotation);
          ctx.scale(p.stretch, 1);
          ctx.font = `${p.size}px Inter, system-ui, sans-serif`;
          ctx.fillStyle = state.stage === "hair" ? "rgba(140,245,255,.72)" : "rgba(220,252,255,.88)";
          ctx.shadowColor = "rgba(0,212,255,.32)";
          ctx.shadowBlur = state.stage === "floating" ? 10 : 4;
          drawSpacedText(p.word, 0, 0, p.spacing);
          ctx.restore();
        }
        ctx.restore();

        if (state.stage === "hair" || state.stage === "reveal") {
          ctx.save();
          ctx.globalCompositeOperation = "lighter";
          ctx.strokeStyle = `rgba(112,230,255,${state.stage === "hair" ? 0.22 : 0.12})`;
          for (let i = 0; i < 36; i++) {
            const t = i / 35;
            const sx = window.innerWidth * (0.18 + t * 0.64);
            const sy = window.innerHeight * 0.28 + Math.sin(t * Math.PI * 4) * 28;
            ctx.beginPath();
            ctx.moveTo(sx, sy);
            ctx.bezierCurveTo(
              sx - 90,
              window.innerHeight * 0.44,
              sx + 110,
              window.innerHeight * 0.72,
              sx + Math.sin(t * Math.PI) * 90,
              window.innerHeight * 0.92,
            );
            ctx.stroke();
          }
          ctx.restore();
        }

        if (state.stage === "reveal") {
          ctx.save();
          ctx.globalAlpha = state.mask;
          ctx.beginPath();
          ctx.ellipse(
            window.innerWidth * 0.5,
            window.innerHeight * 0.5,
            window.innerWidth * (0.08 + state.mask * 0.55),
            window.innerHeight * (0.08 + state.mask * 0.5),
            0,
            0,
            Math.PI * 2,
          );
          ctx.clip();
          if (wigImage) {
            const ratio = wigImage.naturalWidth / wigImage.naturalHeight;
            const drawH = window.innerHeight * 0.82;
            const drawW = drawH * ratio;
            ctx.drawImage(wigImage, window.innerWidth / 2 - drawW / 2, window.innerHeight / 2 - drawH / 2, drawW, drawH);
          } else {
            const fill = ctx.createLinearGradient(0, 0, window.innerWidth, window.innerHeight);
            fill.addColorStop(0, "#8ff7ff");
            fill.addColorStop(1, "#26364c");
            ctx.fillStyle = fill;
            ctx.fillRect(window.innerWidth * 0.18, window.innerHeight * 0.16, window.innerWidth * 0.64, window.innerHeight * 0.72);
          }
          ctx.restore();
        }
      }

      function tick(time) {
        if (!document.hidden) {
          const delta = Math.min(time - last, 48);
          last = time;
          draw(delta);
        }
        raf = requestAnimationFrame(tick);
      }

      function runTimeline() {
        if (timeline) timeline.kill();
        state.stage = "floating";
        state.breath = 1;
        state.mask = 0;
        setStatus("Lexicon drift");
        timeline = gsap.timeline({ delay: 3 });
        timeline
          .call(() => {
            state.stage = "forming";
            setStatus("Magnetic assemble");
            const targets = sampleImagePoints(avatarImage, particles.length);
            const maxDistance = Math.hypot(window.innerWidth, window.innerHeight);
            particles.forEach((p, i) => {
              const target = targets[i % targets.length];
              const distance = Math.hypot(p.x - target.x, p.y - target.y);
              const normalized = distance / maxDistance;
              gsap.to(p, {
                x: target.x,
                y: target.y,
                alpha: clamp(p.baseAlpha + 0.22, 0.35, 0.95),
                rotation: rand(-0.025, 0.025),
                duration: 1.35 + (1 - normalized) * 0.95,
                ease: "power3.out",
                delay: normalized * 0.12,
              });
            });
          })
          .to(
            state,
            {
              breath: 1.02,
              duration: 1.1,
              yoyo: true,
              repeat: 1,
              ease: "sine.inOut",
              onStart: () => {
                state.stage = "breathing";
                setStatus("Avatar breath");
              },
            },
            "+=2.35",
          )
          .call(() => {
            state.stage = "hair";
            setStatus("Text to fiber");
            particles.forEach((p) => {
              const dir = p.x < window.innerWidth * 0.5 ? -1 : 1;
              gsap.to(p, {
                x: p.x + dir * rand(80, 240),
                y: p.y + rand(70, 260),
                alpha: rand(0.1, 0.42),
                stretch: rand(1.8, 3.4),
                spacing: rand(2, 7),
                rotation: dir * rand(0.18, 0.5),
                duration: rand(1.2, 2.2),
                ease: "power2.inOut",
              });
            });
          }, undefined, "+=2")
          .to(state, {
            mask: 1,
            duration: 1.5,
            ease: "power2.inOut",
            onStart: () => {
              state.stage = "reveal";
              setStatus("Final wig reveal");
            },
          });
      }

      avatarInput.addEventListener("change", async (event) => {
        const file = event.target.files && event.target.files[0];
        if (!file) return;
        avatarImage = await loadImageFromUrl(URL.createObjectURL(file));
        createParticles();
        runTimeline();
      });

      wigInput.addEventListener("change", async (event) => {
        const file = event.target.files && event.target.files[0];
        if (!file) return;
        wigImage = await loadImageFromUrl(URL.createObjectURL(file));
      });

      window.addEventListener("pointermove", (event) => {
        pointer.x = (event.clientX / window.innerWidth - 0.5) * 36;
        pointer.y = (event.clientY / window.innerHeight - 0.5) * 28;
      });

      document.addEventListener("visibilitychange", () => {
        if (document.hidden) gsap.globalTimeline.pause();
        else gsap.globalTimeline.resume();
      });

      window.addEventListener("resize", () => {
        resize();
        runTimeline();
      });

      resize();
      loadImageFromUrl("public/assets/miku-avatar.png").then((image) => {
        avatarImage = image;
        return loadImageFromUrl("public/assets/finished-wig.png");
      }).then((image) => {
        wigImage = image;
        runTimeline();
        raf = requestAnimationFrame(tick);
      });
    </script>
  </body>
</html>
